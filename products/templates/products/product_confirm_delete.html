{% extends 'app_base.html' %}

{% block title %}Excluir produto{% endblock %}

{% block app_content %}

<!-- DELETE CONFIRMATION -->
<div class="flex min-h-[60vh] items-center justify-center">

    <div class="glass-card w-full max-w-lg p-2">

        <!-- WARNING ICON -->
        <div class="mb-6 flex h-14 w-14 items-center justify-center rounded-2xl bg-red-50 text-red-600">

            <svg
                class="h-7 w-7"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                    d="M12 9v4m0 4h.01M10.29 3.86l-7.3 12.65A2 2 0 004.72 19.5h14.56a2 2 0 001.73-2.99l-7.3-12.65a2 2 0 00-3.42 0z"
                />
            </svg>

        </div>

        <!-- CONTENT -->
        <div>

            <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-red-500">
                Produtos
            </p>

            <h1 class="text-2xl font-semibold tracking-tight text-zinc-950">
                Excluir produto
            </h1>

            <p class="mt-3 text-sm leading-relaxed text-zinc-500">
                Tem certeza de que deseja excluir
                <span class="font-medium text-zinc-900">
                    "{{ object.name }}"
                </span>?
            </p>

        </div>

        <!-- WARNING -->
        <div class="mt-6 rounded-xl border border-red-200/70 bg-red-50/60 px-4 py-3">

            <div class="flex items-start gap-3">

                <svg
                    class="mt-0.5 h-5 w-5 shrink-0 text-red-500"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                        d="M12 9v4m0 4h.01M10.29 3.86l-7.3 12.65A2 2 0 004.72 19.5h14.56a2 2 0 001.73-2.99l-7.3-12.65a2 2 0 00-3.42 0z"
                    />
                </svg>

                <p class="text-sm leading-relaxed text-red-700">
                    Esta ação não pode ser desfeita.
                </p>

            </div>

        </div>

        <!-- ACTIONS -->
        <form
            method="post"
            class="mt-8 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end"
        >
            {% csrf_token %}

            <a
                href="{% url 'products:list' %}"
                class="btn-secondary inline-flex items-center justify-center"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="inline-flex items-center justify-center gap-2 rounded-xl bg-red-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition-all duration-200 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500/30"
            >

                <svg
                    class="h-4 w-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m3 0V5a2 2 0 012-2h4a2 2 0 012 2v2m-7 4v6m4-6v6m5-10H4"
                    />
                </svg>

                Confirmar exclusão

            </button>

        </form>

    </div>

</div>

{% endblock %}
