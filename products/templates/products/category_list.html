{% extends 'app_base.html' %}

{% block title %}Categorias{% endblock %}

{% block app_content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold tracking-tight">Categorias</h1>
    <a href="{% url 'products:category_create' %}" class="rounded-md bg-zinc-900 text-white px-4 py-2 text-sm font-medium hover:bg-zinc-800">Nova categoria</a>
</div>

<div class="rounded-lg border border-zinc-200 bg-white shadow-sm overflow-hidden">
    <table class="min-w-full divide-y divide-zinc-100">
        <thead class="bg-zinc-50">
            <tr>
                <th class="px-4 py-3 text-left text-xs font-medium uppercase text-zinc-500">Nome</th>
                <th class="px-4 py-3"></th>
            </tr>
        </thead>
        <tbody class="divide-y divide-zinc-100">
            {% for category in categories %}
            <tr class="hover:bg-zinc-50">
                <td class="px-4 py-3 text-sm text-zinc-900">{{ category.name }}</td>
                <td class="px-4 py-3 text-right text-sm">
                    <a href="{% url 'products:category_update' category.pk %}" class="text-zinc-500 hover:text-zinc-900 mr-3">Editar</a>
                    <a href="{% url 'products:category_delete' category.pk %}" class="text-red-600 hover:underline">Excluir</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="2" class="px-4 py-6 text-center text-sm text-zinc-500">Nenhuma categoria cadastrada ainda.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<a href="{% url 'products:list' %}" class="mt-6 inline-block text-sm text-zinc-500 hover:text-zinc-900">← Voltar para produtos</a>
{% endblock %}
