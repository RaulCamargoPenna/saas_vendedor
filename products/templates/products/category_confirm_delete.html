{% extends 'app_base.html' %}

{% block title %}Excluir categoria{% endblock %}

{% block app_content %}
<div class="max-w-md rounded-lg border border-zinc-200 bg-white p-6 shadow-sm">
    <h1 class="text-lg font-semibold text-zinc-900">Excluir categoria "{{ object.name }}"?</h1>
    <p class="mt-2 text-sm text-zinc-500">Esta ação não pode ser desfeita. Produtos vinculados a esta categoria impedirão a exclusão.</p>
    <form method="post" class="mt-6 flex gap-3">
        {% csrf_token %}
        <button type="submit" class="rounded-md bg-red-600 text-white px-4 py-2 text-sm font-medium hover:bg-red-700">Confirmar exclusão</button>
        <a href="{% url 'products:category_list' %}" class="rounded-md border border-zinc-200 bg-white px-4 py-2 text-sm font-medium hover:bg-zinc-50">Cancelar</a>
    </form>
</div>
{% endblock %}
