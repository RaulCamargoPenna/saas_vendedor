services:
  web:
    build: .
    container_name: saas-vendedor-web
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app

  db:
    image: postgres:17
    container_name: saas-vendedor-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
    driver: bridge