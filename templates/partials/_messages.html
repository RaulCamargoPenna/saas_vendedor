{% if messages %}

<div
    class="
        mb-6
        space-y-3
    "
>

    {% for message in messages %}

    <div
        class="
            group
            relative
            flex
            items-start
            gap-3
            overflow-hidden
            rounded-2xl
            border
            px-4
            py-3.5
            text-sm
            shadow-sm
            backdrop-blur-xl
            animate-fade-up

            {% if message.tags == 'success' %}

                border-emerald-200/70
                bg-emerald-50/70
                text-emerald-800

            {% elif message.tags == 'error' %}

                border-red-200/70
                bg-red-50/70
                text-red-800

            {% elif message.tags == 'warning' %}

                border-amber-200/70
                bg-amber-50/70
                text-amber-800

            {% elif message.tags == 'info' %}

                border-blue-200/70
                bg-blue-50/70
                text-blue-800

            {% else %}

                border-zinc-200/70
                bg-white/70
                text-zinc-700

            {% endif %}
        "
        role="alert"
    >

        <!-- =================================================
             ICON
        ================================================== -->

        <div
            class="
                mt-0.5
                flex
                h-7
                w-7
                shrink-0
                items-center
                justify-center
                rounded-lg

                {% if message.tags == 'success' %}

                    bg-emerald-100
                    text-emerald-600

                {% elif message.tags == 'error' %}

                    bg-red-100
                    text-red-600

                {% elif message.tags == 'warning' %}

                    bg-amber-100
                    text-amber-600

                {% elif message.tags == 'info' %}

                    bg-blue-100
                    text-blue-600

                {% else %}

                    bg-zinc-100
                    text-zinc-600

                {% endif %}
            "
        >

            {% if message.tags == 'success' %}

                <!-- Check -->

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="h-4 w-4"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="m4.5 12.75 6 6 9-13.5"
                    />
                </svg>


            {% elif message.tags == 'error' %}

                <!-- Error -->

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="h-4 w-4"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 9v3.75m0 3.75h.007M12 3.75a8.25 8.25 0 1 0 0 16.5 8.25 8.25 0 0 0 0-16.5Z"
                    />
                </svg>


            {% elif message.tags == 'warning' %}

                <!-- Warning -->

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="h-4 w-4"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 9v3.75m0 3.75h.007M10.34 3.75h3.32a1.5 1.5 0 0 1 1.3.75l5.02 8.69a1.5 1.5 0 0 1-1.3 2.25H5.32a1.5 1.5 0 0 1-1.3-2.25l5.02-8.69a1.5 1.5 0 0 1 1.3-.75Z"
                    />
                </svg>


            {% elif message.tags == 'info' %}

                <!-- Info -->

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="h-4 w-4"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M11.25 11.25h1.5v5.25h-1.5zM12 7.5h.007M12 3.75a8.25 8.25 0 1 0 0 16.5 8.25 8.25 0 0 0 0-16.5Z"
                    />
                </svg>


            {% else %}

                <!-- Default -->

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="h-4 w-4"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 6v12m6-6H6"
                    />
                </svg>

            {% endif %}

        </div>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div class="min-w-0 flex-1 pt-1">

            <p class="leading-5">
                {{ message }}
            </p>

        </div>


        <!-- =================================================
             CLOSE
        ================================================== -->

        <button
            type="button"
            onclick="this.closest('[role=alert]').remove()"
            aria-label="Fechar mensagem"
            class="
                shrink-0
                rounded-lg
                p-1
                opacity-50
                transition
                duration-200
                hover:bg-black/5
                hover:opacity-100
            "
        >

            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.8"
                stroke="currentColor"
                class="h-4 w-4"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6 18 18 6M6 6l12 12"
                />
            </svg>

        </button>

    </div>

    {% endfor %}

</div>

{% endif %}
