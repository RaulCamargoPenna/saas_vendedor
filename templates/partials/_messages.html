{% if messages %}
<div class="space-y-2 mb-4">
    {% for message in messages %}
    <div class="rounded-md border px-4 py-3 text-sm
        {% if message.tags == 'success' %} border-emerald-200 bg-emerald-50 text-emerald-700
        {% elif message.tags == 'error' %} border-red-200 bg-red-50 text-red-700
        {% elif message.tags == 'warning' %} border-amber-200 bg-amber-50 text-amber-700
        {% else %} border-zinc-200 bg-zinc-50 text-zinc-700 {% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
