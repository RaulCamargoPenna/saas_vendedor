{% extends 'base.html' %}

{% block title %}Cadastro concluído{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md text-center">
        <h1 class="text-2xl font-semibold tracking-tight">Cadastro recebido!</h1>
        <p class="mt-3 text-sm text-zinc-500">
            Enviamos um link de ativação para o seu e-mail. Depois de confirmar, sua conta
            ficará aguardando a ativação do tenant pela administração do sistema.
        </p>
        <a href="{% url 'accounts:login' %}" class="mt-6 inline-block rounded-md bg-zinc-900 text-white px-6 py-3 text-sm font-medium hover:bg-zinc-800">Ir para o login</a>
    </div>
</div>
{% endblock %}
